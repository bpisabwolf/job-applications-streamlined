<!DOCTYPE html>
<html>
  <body>
    <h3>Add Job Post</h3>

    <label>Job Link</label><br>
    <input id="jobLink" type="text" style="width: 100%;"><br><br>

    <label>Source</label><br>
    <select id="source" style="width: 100%;">
      <option>LinkedIn</option>
      <option>Indeed</option>
      <option>Company Site</option>
      <option>Other</option>
    </select><br><br>

    <label>Job Description</label><br>
    <textarea id="jobDescription" style="width: 100%; height: 250px;"></textarea><br><br>

    <button onclick="submitJob()">Parse + Add Row</button>

    <p id="status"></p>

    <script>
      function submitJob() {
        const jobData = {
          jobLink: document.getElementById("jobLink").value,
          source: document.getElementById("source").value,
          jobDescription: document.getElementById("jobDescription").value
        };

        document.getElementById("status").innerText = "Sending to Apps Script...";

        google.script.run
          .withSuccessHandler(function(message) {
            document.getElementById("status").innerText = message;
          })
          .withFailureHandler(function(error) {
            document.getElementById("status").innerText = "Error: " + error.message;
          })
          .testReceiveJobPost(jobData);
      }
    </script>
  </body>
</html>
